<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Force clear legacy service workers and caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs) {
          for(let r of rs) { r.unregister(); }
        });
      }
      if (window.caches) {
        caches.keys().then(function(keys) {
          for(let k of keys) { caches.delete(k); }
        });
      }
    </script>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <title>PHANTOMS Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet" />
    <script>
      try {
        const theme = localStorage.getItem('tms_theme') || localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      } catch {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
