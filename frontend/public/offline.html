<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PHANTOMS — مفيش اتصال</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0b;
        --card: #151515;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #e51c19;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "Cairo", "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid #2a2a2a;
        border-radius: 18px;
        padding: 28px 22px;
        text-align: center;
      }
      img { width: 56px; height: 56px; margin-bottom: 14px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0 0 20px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 13px 18px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      small { display: block; margin-top: 14px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/branding/phantoms-mark.png" alt="PHANTOMS" />
      <h1>مفيش اتصال بالإنترنت</h1>
      <p>تطبيق PHANTOMS بيحمّل آخر نسخة من السيرفر عشان يفضل محدّث دايماً. اتأكد من الشبكة وجرّب تاني.</p>
      <button type="button" onclick="location.replace('https://dashboard-phantoms.vercel.app/?retry=' + Date.now())">
        إعادة المحاولة
      </button>
      <small>لو الشبكة شغالة والمشكلة مستمرة، جرّب تقفل التطبيق وتفتحه تاني.</small>
    </main>
  </body>
</html>
