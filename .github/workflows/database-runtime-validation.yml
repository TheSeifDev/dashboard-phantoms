name: Database Runtime Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/supabase/**'
      - 'backend/scripts/**'
      - 'frontend/**'
      - '.gitignore'
      - '.github/workflows/database-runtime-validation.yml'
  push:
    branches: [main, 'fix/**']
    paths:
      - 'backend/supabase/**'
      - 'backend/scripts/**'
      - 'frontend/**'
      - '.gitignore'
      - '.github/workflows/database-runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-supabase:
    name: Fresh Supabase migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Validate migration manifest and immutable SQL checksums
        run: |
          node backend/scripts/migration-manifest.mjs
          node --test backend/scripts/migration-manifest.test.mjs
          node --test backend/scripts/migration-deployment-safety.test.mjs
          node frontend/scripts/run-migrations.mjs --check

      - name: Validate bootstrap and Supabase cache safety
        run: |
          node --test backend/scripts/bootstrap-phantoms-owner.test.mjs
          node --test frontend/scripts/supabase-cli-safety.test.mjs

      - name: Assert disposable-only execution
        run: |
          set -euo pipefail
          test ! -e backend/supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_DB_URL:-}"
          supabase --version
          echo "No remote project link or production connection credentials; Docker-local stack only."

      - name: Start disposable local Supabase database
        run: |
          supabase start --workdir backend \
            -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,storage-api

      - name: Verify local migration timestamps
        run: supabase migration list --workdir backend

      - name: Run all existing pgTAP suites on the local database
        run: supabase test db --workdir backend

      - name: Revalidate SQL checksums after disposable execution
        run: node backend/scripts/migration-manifest.mjs

      - name: Stop disposable stack
        if: always()
        run: supabase stop --workdir backend --no-backup

  frontend-validation:
    name: Node tests + TypeScript + lint + production build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: local-build-only-placeholder
      VITE_PUBLIC_WEB_URL: http://localhost:5173
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run existing Node and TypeScript regression tests
        run: |
          npm run test:security
          npm run test:runtime
          npm run test:brand
          npx --yes tsx --test scripts/test-storage-migration.ts scripts/safe-xlsx-test.ts

      - name: TypeScript and lint
        run: |
          npx tsc -b --noEmit
          npm run lint

      - name: Production build and credential scan (no deployment)
        run: |
          npm run build
          npm run audit:build-secrets
