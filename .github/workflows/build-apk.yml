name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Wasla Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies and Build Web Bundle
        working-directory: frontend
        run: |
          npm install
          npx vite build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: |
          npx cap sync android

      - name: Build Signed Android APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/wasla-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasla-app-apk
          path: frontend/android/app/build/outputs/apk/debug/wasla-app.apk
          if-no-files-found: error

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "تطبيق وصلة تك للأندرويد (APK)"
          body: |
            نسخة تطبيق الأندرويد المحدثة تلقائياً لنظام إدارة فريق وصلة تك.
            حمّل الملف `wasla-app.apk` من الأسفل وثبّته مباشرة على هاتفك.
          files: frontend/android/app/build/outputs/apk/debug/wasla-app.apk
          prerelease: false
          make_latest: true
