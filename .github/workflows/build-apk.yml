name: Build PHANTOMS Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Wasla Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies and Build Web Bundle
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: |
          npx cap sync android

      - name: Check for Release Keystore Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build PHANTOMS Android APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.check-secrets.outputs.has_keystore }}" = "true" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/phantoms-app.apk || cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/phantoms-app.apk
          else
            echo "Keystore secrets not configured. Building Debug APK for QA/Testing..."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/phantoms-app-debug.apk
          fi

      - name: Upload Debug APK Artifact
        if: steps.check-secrets.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phantoms-app-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/phantoms-app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        if: steps.check-secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phantoms-app-release-apk
          path: frontend/android/app/build/outputs/apk/release/phantoms-app.apk
          if-no-files-found: error

      - name: Publish Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && steps.check-secrets.outputs.has_keystore == 'true'
        with:
          tag_name: latest-apk
          name: "تطبيق PHANTOMS للأندرويد (Release APK)"
          body: |
            نسخة تطبيق الأندرويد الموقعة رسمياً لنظام إدارة وعمليات فريق PHANTOMS.
            حمّل الملف `phantoms-app.apk` من الأسفل وثبّته مباشرة على هاتفك.
          files: frontend/android/app/build/outputs/apk/release/phantoms-app.apk
          prerelease: false
          make_latest: true
