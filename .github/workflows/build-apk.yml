name: Build PHANTOMS Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build PHANTOMS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies and Build Web Bundle
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: |
          npx cap sync android

      - name: Check for Release Keystore Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "All 4 release keystore secrets are configured."
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "::warning::Android release keystore secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are not fully configured. Building unsigned Debug APK for QA/Testing only."
          fi

      - name: Decode Release Keystore
        if: steps.check-secrets.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Failed to decode ANDROID_KEYSTORE_BASE64 to $RUNNER_TEMP/release.keystore"
            exit 1
          fi

      - name: Build Signed Release APK
        if: steps.check-secrets.outputs.has_keystore == 'true'
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILT_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$BUILT_APK" ]; then
            echo "::error::Signed Release APK not found at $BUILT_APK"
            exit 1
          fi

          cp "$BUILT_APK" app/build/outputs/apk/release/phantoms-app.apk

          echo "Verifying APK signature..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/phantoms-app.apk

          echo "Verifying APK manifest metadata..."
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/release/phantoms-app.apk | grep -E "package: name='com.phantoms.app'"
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/release/phantoms-app.apk | grep -E "application-label:'PHANTOMS'"

          echo "SHA-256 Checksum:"
          sha256sum app/build/outputs/apk/release/phantoms-app.apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Debug APK for QA
        if: steps.check-secrets.outputs.has_keystore != 'true'
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

          BUILT_DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$BUILT_DEBUG" ]; then
            echo "::error::Debug APK not found at $BUILT_DEBUG"
            exit 1
          fi

          cp "$BUILT_DEBUG" app/build/outputs/apk/debug/phantoms-app-debug.apk

          echo "Verifying Debug APK manifest metadata..."
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/phantoms-app-debug.apk | grep -E "package: name='com.phantoms.app'"
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/phantoms-app-debug.apk | grep -E "application-label:'PHANTOMS'"

          echo "SHA-256 Checksum:"
          sha256sum app/build/outputs/apk/debug/phantoms-app-debug.apk

      - name: Upload Debug APK Artifact
        if: steps.check-secrets.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phantoms-app-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/phantoms-app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        if: steps.check-secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phantoms-app-release-apk
          path: frontend/android/app/build/outputs/apk/release/phantoms-app.apk
          if-no-files-found: error

      - name: Publish Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-secrets.outputs.has_keystore == 'true'
        with:
          tag_name: latest-apk
          name: "تطبيق PHANTOMS للأندرويد (Release APK)"
          body: |
            نسخة تطبيق الأندرويد الموقعة رسمياً لنظام إدارة وعمليات فريق PHANTOMS.
            حمّل الملف `phantoms-app.apk` من الأسفل وثبّته مباشرة على هاتفك.
          files: frontend/android/app/build/outputs/apk/release/phantoms-app.apk
          prerelease: false
          make_latest: true
