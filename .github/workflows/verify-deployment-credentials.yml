name: Verify Deployment Credentials

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Credentials & Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Credential & Configuration Verification
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          set -uo pipefail

          FAILED=0
          declare -a CHECK_NAMES=()
          declare -a CHECK_STATUSES=()

          record() {
            local name="$1"
            local status="$2"
            CHECK_NAMES+=("$name")
            CHECK_STATUSES+=("$status")
            if [ "$status" != "PASS" ]; then
              FAILED=1
            fi
          }

          # -------------------------------------------------------------
          # 1. Verify Secret Presence (All 6 Required Secrets)
          # -------------------------------------------------------------
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_VAPID_PUBLIC_KEY; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              record "$var Presence" "PASS"
            else
              record "$var Presence" "FAIL"
            fi
          done

          # -------------------------------------------------------------
          # 2. Verify Vercel Authentication (whoami via VERCEL_TOKEN in env)
          # -------------------------------------------------------------
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            WHOAMI_ERR="$(mktemp)"
            # Execute whoami with VERCEL_TOKEN provided in environment; discard raw output to prevent credential/account leakage
            if npx --yes vercel whoami >/dev/null 2>"$WHOAMI_ERR"; then
              record "Vercel Authentication (whoami)" "PASS"
            else
              record "Vercel Authentication (whoami)" "FAIL"
            fi
            rm -f "$WHOAMI_ERR"
          else
            record "Vercel Authentication (whoami)" "FAIL"
          fi

          # -------------------------------------------------------------
          # 3. Validate VERCEL_ORG_ID and VERCEL_PROJECT_ID Format
          # -------------------------------------------------------------
          if [ -n "${VERCEL_ORG_ID:-}" ] && \
             [[ ! "${VERCEL_ORG_ID}" =~ [[:space:]] ]] && \
             [ "${VERCEL_ORG_ID}" != "your-vercel-org-id" ]; then
            record "VERCEL_ORG_ID Valid Format" "PASS"
          else
            record "VERCEL_ORG_ID Valid Format" "FAIL"
          fi

          if [ -n "${VERCEL_PROJECT_ID:-}" ] && \
             [[ ! "${VERCEL_PROJECT_ID}" =~ [[:space:]] ]] && \
             [ "${VERCEL_PROJECT_ID}" != "your-vercel-project-id" ]; then
            record "VERCEL_PROJECT_ID Valid Format" "PASS"
          else
            record "VERCEL_PROJECT_ID Valid Format" "FAIL"
          fi

          # -------------------------------------------------------------
          # 4. Verify Supabase URL Plausible Format
          # -------------------------------------------------------------
          if [ -n "${VITE_SUPABASE_URL:-}" ] && \
             [[ "${VITE_SUPABASE_URL}" =~ ^https://[A-Za-z0-9.-]+\.[A-Za-z]{2,}(/.*)?$ ]] && \
             [[ ! "${VITE_SUPABASE_URL}" =~ your-project\.supabase\.co ]] && \
             [[ ! "${VITE_SUPABASE_URL}" =~ [[:space:]] ]]; then
            record "Supabase URL Plausible Format" "PASS"
          else
            record "Supabase URL Plausible Format" "FAIL"
          fi

          # -------------------------------------------------------------
          # 5. Verify Supabase Publishable Key Plausible Format
          # -------------------------------------------------------------
          IS_JWT=0
          IS_SBP=0
          IS_SECRET=0

          if [[ "${VITE_SUPABASE_ANON_KEY:-}" =~ ^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
            IS_JWT=1
          fi

          if [[ "${VITE_SUPABASE_ANON_KEY:-}" =~ ^sbp_[A-Za-z0-9_-]+$ ]] || [[ "${VITE_SUPABASE_ANON_KEY:-}" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]]; then
            IS_SBP=1
          fi

          if [[ "${VITE_SUPABASE_ANON_KEY:-}" =~ ^sb_secret_ ]]; then
            IS_SECRET=1
          fi

          if [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] && \
             [ "$IS_SECRET" -eq 0 ] && \
             { [ "$IS_JWT" -eq 1 ] || [ "$IS_SBP" -eq 1 ]; } && \
             [ "${VITE_SUPABASE_ANON_KEY}" != "your-supabase-anon-or-publishable-key" ] && \
             [[ ! "${VITE_SUPABASE_ANON_KEY}" =~ [[:space:]] ]]; then
            record "Supabase Publishable Key Plausible Format" "PASS"
          else
            record "Supabase Publishable Key Plausible Format" "FAIL"
          fi

          # -------------------------------------------------------------
          # 6. Validate VAPID Public Key Plausible Format
          # -------------------------------------------------------------
          if [ -n "${VITE_VAPID_PUBLIC_KEY:-}" ] && \
             [ "${#VITE_VAPID_PUBLIC_KEY}" -ge 20 ] && \
             [ "${VITE_VAPID_PUBLIC_KEY}" != "your-vapid-public-key" ] && \
             [[ ! "${VITE_VAPID_PUBLIC_KEY}" =~ [[:space:]] ]]; then
            record "VAPID Public Key Plausible Format" "PASS"
          else
            record "VAPID Public Key Plausible Format" "FAIL"
          fi

          # -------------------------------------------------------------
          # 7. Output Console Summary (Names Only - Zero Secrets Exposed)
          # -------------------------------------------------------------
          echo ""
          echo "==============================================================="
          echo "        PHANTOMS — DEPLOYMENT CREDENTIALS VERIFICATION"
          echo "==============================================================="
          printf "%-45s | %-6s\n" "Check Name" "Status"
          echo "----------------------------------------------+--------"
          for i in "${!CHECK_NAMES[@]}"; do
            printf "%-45s | %-6s\n" "${CHECK_NAMES[$i]}" "${CHECK_STATUSES[$i]}"
          done
          echo "==============================================================="

          # -------------------------------------------------------------
          # 8. GitHub Actions Step Summary (Markdown)
          # -------------------------------------------------------------
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Deployment Credentials Verification Summary"
              echo ""
              echo "| Check Name | Status |"
              echo "| :--- | :--- |"
              for i in "${!CHECK_NAMES[@]}"; do
                echo "| \`${CHECK_NAMES[$i]}\` | ${CHECK_STATUSES[$i]} |"
              done
              echo ""
              if [ "$FAILED" -eq 0 ]; then
                echo "**:white_check_mark: Final Verdict: ALL CHECKS PASSED**"
              else
                echo "**:x: Final Verdict: ONE OR MORE CHECKS FAILED**"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # -------------------------------------------------------------
          # 9. Final Exit Code
          # -------------------------------------------------------------
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more credential or configuration checks failed."
            exit 1
          fi

          echo "All deployment credentials and configuration formats successfully verified."
